site_name: WAGS
site_description: Web Agent Gateway System
site_author: Tapan Chugh
site_url: https://github.com/chughtapan/wags

repo_name: chughtapan/wags
repo_url: https://github.com/chughtapan/wags

theme:
  name: material
  palette:
    - scheme: slate
      primary: amber
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: amber
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            docstring_style: google

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition

nav:
  - Home: index.md
