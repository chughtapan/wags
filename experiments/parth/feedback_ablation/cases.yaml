      depends on prior conditions being satisfied, such as doors being secured and the brake being engaged. Confirm these
      conditions hold, then proceed if appropriate.
    vague: Before proceeding with this action, take a moment to verify that the vehicle is in the appropriate state for it.
      Confirm, then continue if appropriate.
    verbose: 'Engine start is a state-changing operation that depends on the vehicle being in a configuration suitable for
      ignition. Modern vehicle control systems implement a range of interlocks intended to prevent unsafe or unintended starts:
      doors are typically expected to be secured, the brake pedal is typically expected to be engaged, the transmission is
      expected to be in an appropriate position, and prior tool calls in the session may have left the vehicle in a state
      that needs verification before ignition can safely proceed. A common failure mode in vehicle control workflows is for
      an agent to issue an engine start without confirming these prerequisites, which can lead to the call being rejected,
      partial state changes, or unintended downstream consequences. Before starting the engine, take a moment to verify that
      the vehicle is in the appropriate state — that the relevant precondition steps such as securing doors and engaging the
      brake have been completed in this session. Confirm these conditions hold, then proceed if appropriate.'
