[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wags"
version = "0.0.0.dev0"
description = "WAGS - Middleware orchestration for MCP servers with FastMCP"
requires-python = "~=3.13.5"

dependencies = [
    "fast-agent-mcp==0.10.46",
    "cyclopts>=2.0.0",
    "rich>=13.0.0",
    "jinja2>=3.0.0",
]

[project.scripts]
wags = "wags.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-xdist>=3.0",
    "pytest-timeout>=2.0",
    "ruff",
    "mypy",
]

evals = [
    "bfcl-eval",
    "mcpuniverse",
    "appworld",
    "appworld-experiments[simplified]",
]

[tool.uv]
override-dependencies = [
    # Defer the eval packages' conflicting pins to the versions fast-agent-mcp==0.10.46 requires
    "mcp==2.3.0",  # mcpuniverse's mcp==1.13.1
    "openai[aiohttp,realtime]==3.24.0",  # appworld-experiments' openai<=1.99.8 and mcpuniverse's openai==1.106.1
    "anthropic[vertex]==1.11.0",  # mcpuniverse's anthropic==0.49.0
    "google-genai==2.28.0",  # mcpuniverse's google-genai==1.16.1
    "pydantic==2.14.0",  # mcpuniverse's pydantic==2.11.7
    "pyyaml==6.0.3",  # mcpuniverse's pyyaml==6.0.2
    "tiktoken==0.14.0",  # mcpuniverse's tiktoken==0.11.0
    "filelock==4.0.12",  # bfcl-eval's filelock==3.20.0
    "anyio>=4.10.0,<5",  # mcpuniverse's anyio==4.9.0
    "click>=8.4.2,<9.0.0",  # mcpuniverse's click==8.1.8
    "google-auth>=2.56.0,<3.0.0",  # mcpuniverse's google-auth==2.38.0
    "mistralai>=1.7.0",  # Override mcpuniverse's mistralai==1.6.0 constraint
    "python-dotenv>=1.1.0",  # Override mcpuniverse's python-dotenv==1.0.1 constraint
    "uvicorn>=0.35.0",  # Override mcpuniverse's uvicorn==0.34.0 constraint
    "fastapi>=0.121.0",  # Override mcpuniverse's fastapi==0.115.12 constraint
]

[tool.uv.sources]
bfcl-eval = { git = "https://github.com/chughtapan/gorilla.git", subdirectory = "berkeley-function-call-leaderboard", branch = "wags-dev" }
mcpuniverse = { git = "https://github.com/vinamra57/MCP-Universe.git", branch = "wags-dev" }
appworld = { git = "https://github.com/chughtapan/appworld.git", branch = "wags-dev" }
appworld-experiments = { git = "https://github.com/chughtapan/appworld.git", branch = "wags-dev", subdirectory = "experiments" }

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["README.md"]

[tool.ruff.lint]
select = [
    "C4",    # flake8-comprehensions
    "C90",   # mccabe
    "E",     # pycodestyle
    "F",     # pyflakes
    "I",     # isort
    "PERF",  # Perflint
    "PL",    # Pylint
    "UP",    # pyupgrade
]
ignore = ["PERF203", "PLC0415", "PLR0402"]

[tool.ruff.lint.per-file-ignores]
# Handler methods have many required parameters matching API signatures
"servers/*/handlers.py" = ["PLR0913", "PLR0917"]
# CLI commands naturally have many parameters (one per flag/option)
"src/wags/cli/main.py" = ["PLR0913"]
# Pytest fixtures require many parameters
"tests/benchmarks/appworld/test_appworld.py" = ["PLR0913", "PLR0917"]
# Reporting functions naturally have high complexity due to formatting logic
"tests/benchmarks/appworld/reporting.py" = ["C901", "PLR0912", "PLR0915"]

[tool.ruff.lint.pylint]
allow-magic-value-types = ["bytes", "float", "int", "str"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
# Only run unit and integration tests by default
norecursedirs = ["tests/benchmarks", "tests/e2e", "tests/smoke"]
filterwarnings = [
    "ignore::sqlalchemy.exc.SADeprecationWarning:appworld.apps.lib.models.db",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20:appworld.apps.*",
]
timeout = 0
timeout_method = "thread"  # Use thread-based timeout for better async compatibility

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_subclassing_any = true
disallow_untyped_calls = true

[[tool.mypy.overrides]]
module = "bfcl_eval.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mcpuniverse.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "appworld.*",
    "appworld_experiments.*",
]
follow_untyped_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = "tests.benchmarks.appworld.mcp_server"
disable_error_code = ["attr-defined", "no-untyped-call", "misc"]
