mcp:
  servers:
    github:
      transport: stdio
      command: wags
      args:
        - start-server
        - servers/github
      env:
        GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN}
